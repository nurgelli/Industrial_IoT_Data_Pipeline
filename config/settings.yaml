# Production-Level SCADA Pipeline — Konfigürasyon
# Türkmenistan OT Senaryosu

app:
  name: 'SCADA Production Pipeline'
  environment: 'development' # development, staging, production
  debug: true

# ============================================
# 1a. OPC-UA Server (Veri Kaynağı)
# ============================================
opc_ua_server:
  endpoint: 'opc.tcp://0.0.0.0:4840/'
  namespace_idx: 2
  namespace_uri: 'http://opcfoundation.org/SCADA/Demo'

  # Sanal Ekipmanlar (Equipment Nodes)
  equipment:
    - id: 'pump_1'
      name: 'Centrifugal Pump #1'
      location: 'Ashkhabad Plant A'
      protocol: 'OPC-UA'
      tags:
        - name: 'temperature'
          unit: '°C'
          min: 20
          max: 80
          initial_value: 45.2
        - name: 'pressure'
          unit: 'PSI'
          min: 0
          max: 150
          initial_value: 75.5
        - name: 'vibration'
          unit: 'mm/s'
          min: 0
          max: 20
          initial_value: 2.1

    - id: 'compressor_1'
      name: 'Air Compressor #1'
      location: 'Turkmenbashi Plant B'
      protocol: 'OPC-UA'
      tags:
        - name: 'temperature'
          unit: '°C'
          min: 10
          max: 60
          initial_value: 35.0
        - name: 'pressure'
          unit: 'PSI'
          min: 50
          max: 200
          initial_value: 120.0
        - name: 'flow_rate'
          unit: 'm³/h'
          min: 0
          max: 500
          initial_value: 250.0

    - id: 'heater_1'
      name: 'Process Heater #1'
      location: 'Nebitdag Plant C'
      protocol: 'OPC-UA'
      tags:
        - name: 'temperature'
          unit: '°C'
          min: 100
          max: 300
          initial_value: 180.0
        - name: 'pressure'
          unit: 'PSI'
          min: 0
          max: 100
          initial_value: 45.0
        - name: 'power_consumption'
          unit: 'kW'
          min: 0
          max: 500
          initial_value: 250.0

  # Node subscription ayarları
  publishing_interval_ms: 1000
  sampling_interval_ms: 500
  queue_size: 100

# ============================================
# 1b. Modbus TCP Server (Veri Kaynağı)
# ============================================
modbus_server:
  host: '0.0.0.0'
  port: 502

  # Holding Registers mapping
  registers:
    - address: 0 # pump_1 temperature
      equipment_id: 'pump_1'
      tag: 'temperature'
      scale: 0.1 # Raw value * 0.1 = actual value

    - address: 1 # pump_1 pressure
      equipment_id: 'pump_1'
      tag: 'pressure'
      scale: 1.0

    - address: 2 # pump_1 vibration
      equipment_id: 'pump_1'
      tag: 'vibration'
      scale: 0.1

    - address: 10 # compressor_1 temperature
      equipment_id: 'compressor_1'
      tag: 'temperature'
      scale: 0.1

    - address: 11 # compressor_1 pressure
      equipment_id: 'compressor_1'
      tag: 'pressure'
      scale: 1.0

    - address: 12 # compressor_1 flow_rate
      equipment_id: 'compressor_1'
      tag: 'flow_rate'
      scale: 1.0

    - address: 20 # heater_1 temperature
      equipment_id: 'heater_1'
      tag: 'temperature'
      scale: 1.0

    - address: 21 # heater_1 pressure
      equipment_id: 'heater_1'
      tag: 'pressure'
      scale: 0.1

    - address: 22 # heater_1 power
      equipment_id: 'heater_1'
      tag: 'power_consumption'
      scale: 1.0

  # Polling interval (Modbus'tan ne sıklıkla oku)
  polling_interval_sec: 1

# ============================================
# 2. OPC-UA Client (Protokol)
# ============================================
opc_ua_client:
  server_endpoint: 'opc.tcp://localhost:4840/'
  username: null # null = anonymous
  password: null

  # Bağlantı retry stratejisi
  reconnect:
    enabled: true
    initial_delay_sec: 1
    max_delay_sec: 60
    exponential_base: 2
    max_retries: 10

  # Subscription ayarları
  subscription:
    publishing_interval_ms: 1000
    max_notifications_per_publish: 100
    lifetime_count: 3

# ============================================
# 3. Python Bridge (Dual Protocol Collector)
# ============================================
python_bridge:
  # OPC-UA client bağlantısı
  opc_ua:
    enabled: true
    endpoint: 'opc.tcp://localhost:4840/'
    namespace_idx: 2

  # Modbus client bağlantısı
  modbus:
    enabled: true
    host: 'localhost'
    port: 502
    timeout_sec: 5

  # Ortak JSON format çıkışı
  output:
    format: 'json'
    include_metadata: true
    include_quality_flag: true

  # Bridge → MQTT producer
  mqtt_output:
    enabled: true
    broker: 'localhost'
    port: 1883

# ============================================
# 4. MQTT Broker (Eclipse Mosquitto)
# ============================================
mqtt_broker:
  host: '0.0.0.0'
  port: 1883
  max_connections: 1000
  max_queued_messages: 1000
  message_size_limit: 0 # 0 = unlimited

  # Topic yapısı
  topic_structure:
    prefix: 'plant/'
    # Örnek topic: plant/pump_1/temperature
    pattern: '{prefix}{equipment_id}/{tag}'

  # Persistence
  persistence_enabled: true
  persistence_file: './mosquitto_persistence/mosquitto.db'

# ============================================
# 5. MQTT Consumer (Streaming Ingestion)
# ============================================
mqtt_consumer:
  broker: 'localhost'
  port: 1883
  client_id: 'scada_consumer_1'

  # Subscribe ayarları
  topics:
    - pattern: 'plant/#'
      qos: 1

  # Batch buffering (stream → batch dönüşümü)
  batch:
    buffer_size: 100 # Kaç mesaj biriksin
    buffer_timeout_sec: 5 # Veya kaç saniye bekle
    max_batch_size: 1000 # Tek batch'in max boyutu

  # Consumer → Database
  output:
    target: 'database' # or "file", "kafka"
    table: 'sensor_readings_raw'

# ============================================
# 5b. Data Cleaning Pipeline
# ============================================
data_cleaning:
  # NaN / Missing Value Handling
  nan_handling:
    strategy: 'drop' # drop, forward_fill, backward_fill, interpolate
    interpolation_method: 'linear' # linear, nearest, zero, slinear, quadratic, cubic

  # Spike Detection (Z-Score)
  spike_detection:
    enabled: true
    zscore_threshold: 3.0 # σ = 3 ⇒ 99.7% confidence
    window_size: 10 # Kaç deneye bak

  # Noise Filtering (Median)
  noise_filtering:
    enabled: true
    median_window: 3 # 3-nokta rolling median

  # Outlier Detection (IQR)
  outlier_detection:
    enabled: true
    iqr_multiplier: 1.5 # IQR * 1.5 ⇒ outlier range

  # Output tables
  output:
    raw_table: 'sensor_readings_raw' # Temizlenmemiş veri
    clean_table: 'sensor_readings' # Temiz veri (production)
    anomaly_table: 'cleaning_anomalies' # Anomali log'u

  # Logging
  log_anomalies: true
  anomaly_log_file: './logs/cleaning_anomalies.log'

# ============================================
# 6-7. TimescaleDB (Veritabanı + Schema)
# ============================================
timescaledb:
  connection:
    host: 'localhost'
    port: 5432
    user: 'postgres'
    password: 'postgres_pwd'
    dbname: 'scada_prod'
    pool_size: 20
    max_overflow: 10

  # Hypertable ayarları
  hypertables:
    - name: 'sensor_readings'
      time_column: 'time'
      space_partition_by: 'equipment_id'
      chunk_time_interval: '1 day'

    - name: 'alarm_events'
      time_column: 'time'
      space_partition_by: 'equipment_id'
      chunk_time_interval: '7 days'

  # Retention Policy
  retention:
    - table: 'sensor_readings'
      raw_interval: '30 days'
      compressed_interval: '365 days'

    - table: 'alarm_events'
      raw_interval: '90 days'
      compressed_interval: '3 years'

  # Compression Policy
  compression:
    - table: 'sensor_readings'
      interval: '1 day'

    - table: 'alarm_events'
      interval: '7 days'

  # Indexing
  indexes:
    - table: 'sensor_readings'
      columns: ['time', 'equipment_id']

    - table: 'alarm_events'
      columns: ['time', 'equipment_id', 'state']

  # Materialized Views (Analytics)
  materialized_views:
    - name: 'mv_hourly_stats'
      source_table: 'sensor_readings'
      interval: '1 hour' # Refresh interval

    - name: 'mv_daily_stats'
      source_table: 'sensor_readings'
      interval: '1 day'

# ============================================
# 8. Grafana (Visualization)
# ============================================
grafana:
  server:
    http_port: 3000
    domain: 'localhost'
    root_url: 'http://localhost:3000/'

  admin:
    user: 'admin'
    password: 'grafana_admin_pwd'

  # Datasource
  datasources:
    - name: 'TimescaleDB'
      type: 'postgres'
      url: 'postgresql://localhost:5432/scada_prod'
      user: 'postgres'
      password: 'postgres_pwd'
      database: 'scada_prod'

  # Dashboards yolu
  dashboards_path: './src/layer8_grafana/dashboards'

  # Alert notification channels
  alerting:
    enabled: true
    notification_channel: 'scada_alerts_mqtt'

# ============================================
# 9. Python Analytics (Scheduled Tasks)
# ============================================
analytics:
  scheduler:
    type: 'apscheduler' # Advanced Python Scheduler

  jobs:
    - name: 'hourly_aggregation'
      schedule: 'cron'
      hour: '*' # Her saat
      minute: 0

    - name: 'daily_aggregation'
      schedule: 'cron'
      hour: 0
      minute: 0 # Günlük, gece yarısı

    - name: 'anomaly_detection'
      schedule: 'interval'
      seconds: 60 # Her 1 dakika

# ============================================
# 10. ML Anomaly Detection (Isolation Forest)
# ============================================
anomaly_detection:
  algorithm: 'isolation_forest'

  model:
    contamination: 0.05 # %5 anomali bekleniyor
    n_estimators: 100
    random_state: 42

  # Training data
  training:
    lookback_hours: 168 # 1 hafta geçmiş veriyle train
    min_samples: 1000 # Min 1000 sample gerekli
    retraining_interval_hours: 24 # Günlük retrain

  # Anomaly scoring
  scoring:
    anomaly_score_threshold: -0.5
    alert_on_anomaly: true
    alert_channel: 'mqtt'

# ============================================
# 11. Alert System (ISA-18.2)
# ============================================
alert_system:
  # ISA-18.2 State Machine
  alarm_states:
    - 'UNACKED' # Alarm aktif, operator bilgilendirilmedi
    - 'ACKED' # Operator tarafından onaylandı
    - 'RTN' # Condition iyileşti (Return to Normal)

  # Deadband (hysteresis)
  deadband_percent: 3.0 # Eşiğin ±%3'ü

  # Notification
  notifications:
    - channel: 'grafana'
      enabled: true

    - channel: 'mqtt'
      enabled: true
      topic: 'alerts/critical'
      qos: 2

    - channel: 'email'
      enabled: false
      recipients:
        - 'operator@plant.tm'
        - 'supervisor@plant.tm'

# ============================================
# 12. Docker Configuration
# ============================================
docker:
  compose_file: './docker/docker-compose.yml'

  services:
    - name: 'timescaledb'
      image: 'timescale/timescaledb:latest-pg14'
      restart_policy: 'unless-stopped'

    - name: 'mosquitto'
      image: 'eclipse-mosquitto:latest'
      restart_policy: 'unless-stopped'

# ============================================
# 13. Logging Configuration
# ============================================
logging:
  level: 'INFO' # DEBUG, INFO, WARNING, ERROR
  format: 'json' # json or text

  handlers:
    - name: 'file'
      level: 'INFO'
      filename: './logs/{service_name}.log'
      max_bytes: 10485760 # 10MB
      backup_count: 5

    - name: 'console'
      level: 'DEBUG'

  services:
    - name: 'bridge'
      level: 'DEBUG'

    - name: 'consumer'
      level: 'INFO'

    - name: 'cleaner'
      level: 'WARNING'

    - name: 'analytics'
      level: 'INFO'

# ============================================
# 14. Fault Tolerance & Retry Logic
# ============================================
fault_tolerance:
  retry:
    max_attempts: 10
    initial_delay_sec: 1
    max_delay_sec: 60
    exponential_base: 2

  circuit_breaker:
    enabled: true
    failure_threshold: 5 # 5 ardışık hata → açıl
    recovery_timeout_sec: 30

  reconnect:
    enabled: true
    strategy: 'exponential_backoff'

# ============================================
# 15. Documentation Settings
# ============================================
documentation:
  architecture_diagram: './docs/ARCHITECTURE.md'
  batch_vs_streaming: './docs/BATCH_VS_STREAMING.md'
  modbus_vs_opcua: './docs/MODBUS_VS_OPCUA.md'
  ot_security: './docs/OT_SECURITY.md'
  deployment_guide: './docs/DEPLOYMENT.md'

# ============================================
# 6. Data Cleaning & Validation (STEP 5)
# ============================================
data_cleaning:
  # NaN handling strategy
  method: 'drop'  # Options: drop, forward_fill, backward_fill, interpolate
  
  # Spike detection (Z-score method)
  # Spike if |value - mean| > z_score_threshold × stdev
  z_score_threshold: 3.0
  
  # Outlier detection (IQR method)
  # Outlier if value < Q1 - iqr_multiplier×IQR or value > Q3 + iqr_multiplier×IQR
  iqr_multiplier: 1.5
  
  # Noise filtering (rolling median)
  # Apply 3-point median filter to smooth high-frequency noise
  rolling_window_size: 3
  
  # Minimum readings required for statistical analysis
  # (Z-score needs enough samples for reliable mean/stdev)
  min_readings_for_stats: 10
  
  # Enable detailed anomaly logging
  log_anomalies: true
  
  # Anomaly types to log
  anomaly_types:
    - 'nan'
    - 'spike'
    - 'outlier'
    - 'noise'

# ============================================
# 7. TimescaleDB Database (STEP 6)
# ============================================
database:
  # Connection settings
  host: 'localhost'
  port: 5432
  name: 'scada_db'
  user: 'postgres'
  password: 'postgres'  # Change in production!
  
  # Connection pool
  pool_size: 5
  pool_timeout_sec: 10
  
  # Batch settings
  batch_timeout_sec: 5
  
  # Data retention
  retention:
    sensor_readings_days: 30      # Raw data: 30 days
    sensor_readings_compressed_days: 365  # Compressed: 1 year
    alarm_events_days: 90         # Alarms: 90 days
    
  # Enable compression
  enable_compression: true
  compression_orderby: 'time DESC'
  compression_segmentby: 'equipment_id,tag'

