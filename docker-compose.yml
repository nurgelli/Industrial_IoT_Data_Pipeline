version: '3.9'

services:
  # ============================================
  # TimescaleDB (PostgreSQL + Time-Series Extension)
  # ============================================
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: scada_timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pwd
      POSTGRES_DB: scada_prod
    ports:
      - "5432:5432"
    volumes:
      # Veri kalıcılığı için volume
      - timescaledb_data:/var/lib/postgresql/data
      # Schema initialization script
      - ./src/layer6_timescaledb/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      # Retention policy script
      - ./src/layer6_timescaledb/retention_policy.sql:/docker-entrypoint-initdb.d/02_retention_policy.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - scada_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Eclipse Mosquitto (MQTT Broker)
  # ============================================
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: scada_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"  # WebSocket port
    volumes:
      # Mosquitto konfigürasyonu
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      # Kalıcılık için volume
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    environment:
      TZ: "Asia/Ashkhabad"
    restart: unless-stopped
    networks:
      - scada_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - timescaledb  # DB hazırlanana kadar bekle

  # ============================================
  # pgAdmin (Optional - Database Management UI)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: scada_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@scada.local
      PGADMIN_DEFAULT_PASSWORD: pgadmin_pwd
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - scada_network
    depends_on:
      - timescaledb

volumes:
  timescaledb_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local
  pgadmin_data:
    driver: local

networks:
  scada_network:
    driver: bridge
    name: scada_network
