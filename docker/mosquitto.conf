# Eclipse Mosquitto Configuration for SCADA Pipeline
# Production-level MQTT broker setup

# ============================================
# Network Configuration
# ============================================

# Tüm network interfaces'te dinle
listener 1883
protocol mqtt

# WebSocket listener (opsiyonel - web clients için)
listener 9001
protocol websockets

# Binding address (Docker container'da 0.0.0.0)
bind_address 0.0.0.0

# ============================================
# Performance Tuning
# ============================================

# Maximum bağlantı sayısı
max_connections 1000

# Maximum queued message sayısı
max_queued_messages 1000

# Message size limit (0 = unlimited, defaults to 20MB)
message_size_limit 0

# Client ID prefix (opsiyonel)
# client_id_prefix 

# ============================================
# Persistence (Veri Kalıcılığı)
# ============================================

# Kalıcılık aç/kapat
persistence true

# Persistence dosya adı
persistence_file mosquitto.db

# Persistence dizin
persistence_location /mosquitto/data/

# Kalıcılık kaç saniyede bir sync edilsin
autosave_interval 1000

# ============================================
# Security & Authentication
# ============================================

# Default: anonymous connections izin ver
# Production'da disable et!
allow_anonymous true

# Password file (opsiyonel)
# password_file /mosquitto/config/passwd.txt

# ACL (Access Control List) file (opsiyonel)
# acl_file /mosquitto/config/aclfile

# TLS/SSL (opsiyonel - production için önerilir)
# cafile /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key

# ============================================
# Logging
# ============================================

# Log output location
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Log type
log_type all

# Log timestamp format
log_timestamp true

# ============================================
# Topic Settings
# ============================================

# System topics publish aralığı (saniye)
# 0 = disabled
sys_interval 10

# MQTT version (3.1.1 or 5.0)
mqtt_version 311

# ============================================
# QoS & Delivery
# ============================================

# Disconnected client mesajlarını tutalım
queue_qos0_messages true

# Retained messages
retain_available true

# ============================================
# Plugin & Extensions (opsiyonel)
# ============================================

# plugin_order: specify plugin loading order
# plugin /usr/lib/mosquitto_plugins/mosquitto_delayed_publish.so
# plugin_opt_foo bar

# ============================================
# Performance Monitoring
# ============================================

# Status topic publish aralığı
status_interval 10

# ============================================
# Listener-Specific Settings
# ============================================

# MQTT Listener (1883)
listener 1883
protocol mqtt
use_username_pw_false true

# WebSocket Listener (9001)
listener 9001
protocol websockets
use_username_pw_false true

# ============================================
# Cluster / Bridge Settings (opsiyonel)
# ============================================

# Eğer birden fazla Mosquitto instance'ı köprülemek istersen:
# connection bridge_name
# address other_broker_address:1883
# topic # both 0
# outgoing_queue_length 100

# ============================================
# Session Handling
# ============================================

# Persistent session timeout (saniye)
persistent_client_expiration 7d

# ============================================
# Resource Limits
# ============================================

# Max. inflight messages per client
max_inflight_messages 20

# Max. publish queue size per client
max_queued_messages 1000

# ============================================
# Default ACL (eğer enable_default_acl true ise)
# ============================================

# ACL dosyası olmadığında, tümünü izin ver
# (Development mode — Production'da değiştir!)

